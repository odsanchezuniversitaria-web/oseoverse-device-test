<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b2b" />
    <title>Oseoverse · prueba PC, celular y Quest</title>
    <script type="module" crossorigin src="./assets/index-jcT28KYe.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-9N1SKcfq.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title">OSEOVERSE <span>Prueba de dispositivos</span></div>
      <div id="instructions">PC: WASD, ratón y clic · Celular: mover, mirar y tocar · Quest: entrar en VR y usar el gatillo</div>
      <div id="status" aria-live="polite">Acércate al cubo amarillo del stand y actívalo.</div>
      <div id="score">Interacciones: <strong>0</strong></div>
    </div>
    <div id="room-panel">
      <div id="room-title">Sala multijugador <span id="people-count">1 persona</span></div>
      <div id="room-controls">
        <input id="player-name" aria-label="Tu nombre" maxlength="18" placeholder="Tu nombre" autocomplete="nickname" />
        <input id="room-code" aria-label="Código de sala" maxlength="8" placeholder="Código de sala" autocomplete="off" />
        <button id="join-room" type="button">Entrar</button>
        <button id="create-room" type="button">Crear sala</button>
      </div>
      <div id="room-message" aria-live="polite">Crea una sala y comparte el enlace para probar con otra persona.</div>
      <button id="copy-link" type="button" hidden>Copiar enlace</button>
    </div>
    <div id="mobile-ui">
      <div id="move-pad"><div id="move-knob"></div></div>
      <button id="interact" type="button">ACTIVAR</button>
    </div>
  </body>
</html>
